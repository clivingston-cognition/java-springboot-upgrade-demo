<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Todo List')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1>My Todos</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="stats-bar">
        <span class="stat">Total: <strong th:text="${totalCount}">0</strong></span>
        <span class="stat">Pending: <strong th:text="${pendingCount}">0</strong></span>
        <span class="stat">Completed: <strong th:text="${completedCount}">0</strong></span>
    </div>

    <div class="actions-bar">
        <a th:href="@{/todos/new}" class="btn btn-primary">+ New Todo</a>
    </div>

    <div th:if="${#lists.isEmpty(todos)}" class="empty-state">
        <p>No todos yet. Create one to get started!</p>
    </div>

    <table th:unless="${#lists.isEmpty(todos)}" class="todo-table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Priority</th>
            <th>Due Date</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="todo : ${todos}" th:classappend="${todo.status.name() == 'COMPLETED'} ? 'completed-row' : ''">
            <td>
                <a th:href="@{/todos/{id}(id=${todo.id})}" th:text="${todo.title}">Title</a>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${todo.status.name()}"
                      th:text="${todo.status}">Status</span>
            </td>
            <td>
                <span class="badge"
                      th:classappend="'priority-' + ${todo.priority.name()}"
                      th:text="${todo.priority}">Priority</span>
            </td>
            <td th:text="${todo.dueDate != null} ? ${#temporals.format(todo.dueDate, 'yyyy-MM-dd')} : 'N/A'">Date</td>
            <td class="actions">
                <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-sm"
                            th:text="${todo.status.name() == 'COMPLETED'} ? 'Undo' : 'Done'">Toggle</button>
                </form>
                <a th:href="@{/todos/{id}/edit(id=${todo.id})}" class="btn btn-sm btn-edit">Edit</a>
                <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" class="inline-form"
                      onsubmit="return confirm('Delete this todo?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

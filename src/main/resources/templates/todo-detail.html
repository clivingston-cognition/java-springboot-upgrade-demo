<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Todo Detail')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 th:text="${todo.title}">Todo Title</h1>

    <div class="detail-card">
        <div class="detail-row">
            <span class="detail-label">Status:</span>
            <span class="badge" th:classappend="${todo.status.name()}" th:text="${todo.status}">Status</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Priority:</span>
            <span class="badge" th:classappend="'priority-' + ${todo.priority.name()}" th:text="${todo.priority}">Priority</span>
        </div>
        <div class="detail-row" th:if="${todo.description}">
            <span class="detail-label">Description:</span>
            <p th:text="${todo.description}">Description text</p>
        </div>
        <div class="detail-row">
            <span class="detail-label">Due Date:</span>
            <span th:text="${todo.dueDate != null} ? ${#temporals.format(todo.dueDate, 'yyyy-MM-dd')} : 'Not set'">Date</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Created:</span>
            <span th:text="${#temporals.format(todo.createdAt, 'yyyy-MM-dd HH:mm')}">Date</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Updated:</span>
            <span th:text="${#temporals.format(todo.updatedAt, 'yyyy-MM-dd HH:mm')}">Date</span>
        </div>
    </div>

    <div class="detail-actions">
        <a th:href="@{/todos/{id}/edit(id=${todo.id})}" class="btn btn-primary">Edit</a>
        <form th:action="@{/todos/{id}/toggle(id=${todo.id})}" method="post" class="inline-form">
            <button type="submit" class="btn"
                    th:text="${todo.status.name() == 'COMPLETED'} ? 'Mark Pending' : 'Mark Complete'">Toggle</button>
        </form>
        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post" class="inline-form"
              onsubmit="return confirm('Delete this todo?');">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
        <a th:href="@{/}" class="btn btn-secondary">Back to List</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

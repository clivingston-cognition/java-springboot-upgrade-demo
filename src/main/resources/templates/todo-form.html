<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edit Todo' : 'New Todo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 th:text="${editing} ? 'Edit Todo' : 'Create New Todo'">Form</h1>

    <form th:action="${editing} ? @{/todos/{id}(id=${todoId})} : @{/todos}"
          th:object="${todoRequest}"
          method="post"
          class="todo-form">

        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required maxlength="255"/>
            <div th:if="${#fields.hasErrors('title')}" class="error" th:errors="*{title}">Error</div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4" maxlength="1000"></textarea>
            <div th:if="${#fields.hasErrors('description')}" class="error" th:errors="*{description}">Error</div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" th:field="*{priority}" class="form-control">
                    <option value="">-- Select --</option>
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}">Priority</option>
                </select>
            </div>

            <div class="form-group" th:if="${editing}">
                <label for="status">Status</label>
                <select id="status" th:field="*{status}" class="form-control">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}">Status</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control"/>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Update' : 'Create'">Submit</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
